---
layout: default
---
<article class="post-article post-thoughts">
  <p class="post-date">
    <time id="post-date" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%d %B %Y %H:%M" }}
    </time>
  </p>
  
  <div class="post-body">
    {{ content }}
  </div>

  {% if page.tags.size > 0 %}
    <div class="post-tags">
      Tags: {% for tag in page.tags %}<a href="{{ '/tag/' | relative_url }}?t={{ tag | uri_escape }}" class="inherit-link">#{{ tag }}</a>{% unless forloop.last %} {% endunless %}{% endfor %}
    </div>
  {% endif %}
  
</article>

<script>
  (function() {
    var dateEls = document.querySelectorAll('#post-date, .post-updated-time');
    if (!dateEls.length) return;

    var formatter = new Intl.DateTimeFormat('en-GB', {
      month: 'long',
      day: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit',
      hour12: false
    });

    dateEls.forEach(function(timeEl) {
      var iso = timeEl.getAttribute('datetime');
      if (!iso) return;
      var date = new Date(iso);
      if (isNaN(date.getTime())) return;
      timeEl.textContent = formatter.format(date);
    });
  })();
</script>
