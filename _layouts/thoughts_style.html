---
layout: default
---
<article class="post-article post-thoughts">
  <p class="post-date">
    <time class="js-format-date" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%d %B %Y %H:%M" }}
    </time>
  </p>

  <div class="post-body">
    {{ content }}
  </div>

  {% include post-tags.html tags=page.tags %}
</article>
