    {% assign days = "8,19,4,16,22,2,13,10,20,7,12,24,5,17,3,23,9,15,1,21,11,18,6,14" | split: "," %}
    {% for day in days %}
      {% assign position = forloop.index0 %}
      {% assign shape = 'advent-arch' %}
      {% if position < 2 %}
        {% assign x = position | times: 216 | plus: 132 %}
        {% assign y = 132 %}
      {% elsif position < 20 %}
        {% assign floor_index = position | minus: 2 %}
        {% assign x = floor_index | modulo: 6 | times: 58 | plus: 95 %}
        {% assign y = floor_index | divided_by: 6 | times: 96 | plus: 219 %}
        {% if position < 14 %}{% assign shape = 'advent-window' %}{% endif %}
      {% else %}
        {% assign x = position | minus: 20 | times: 90 | plus: 105 %}
        {% assign y = 502 %}
        {% assign shape = 'advent-entry' %}
      {% endif %}
      {% assign day_string = day | prepend: "0" | slice: -2, 2 %}
      {% assign calendar_date = december | append: day_string %}
      {% assign linked_post = nil %}
      {% for post in site.posts %}
        {% assign post_date = post.date | date: "%Y-%m-%d" %}
        {% if post_date == calendar_date %}
          {% assign linked_post = post %}
          {% break %}
        {% endif %}
      {% endfor %}
      <g transform="translate({{ x }} {{ y }})">
        {% if position >= 2 and position < 8 %}
          <use href="#advent-awning" aria-hidden="true"/>
        {% elsif position < 20 %}
          <path class="advent-paper" d="M-27 6v-4q27-17 54 0v4Q0-9-27 6Z" aria-hidden="true"/>
          {% if position >= 14 %}
            <use href="#advent-keystone" y="-7" aria-hidden="true"/>
          {% endif %}
        {% endif %}
        {% capture surprise %}{% cycle 'advent-gift', 'advent-star', 'advent-bauble', 'advent-candle' %}{% endcapture %}
        {% assign wreath_position = position | modulo: 2 %}
        {% capture door %}
          <use class="advent-window-casing" href="#{{ shape }}"/>
          <use class="advent-leaf-frame" href="#{{ shape }}"/>
          <use class="advent-recess" href="#{{ shape }}-glass"/>
          {% capture leaf %}
            <use class="advent-lit-panes" href="#{{ shape }}-glass"/>
            <use class="advent-glass-glints" href="#advent-glass-glints" aria-hidden="true"/>
            <path class="advent-glazing-bars" d="M-18 23h36m-36 2h36M-18 49h36"/>
            {% if shape == 'advent-window' %}
              <path class="advent-glazing-bars" d="M-9 8v15M9 8v15"/>
            {% else %}
              <path class="advent-glazing-bars" d="M-15 14l9 9m21-9-9 9M0 6v17"/>
            {% endif %}
            <path class="advent-window-hardware" d="M-5 51v2m10-2v2"/>
          {% endcapture %}
          <g clip-path="url(#{{ shape }}-opening)">
            <g class="advent-panel advent-panel-left">
              <g clip-path="url(#advent-left-leaf)">{{ leaf }}</g>
            </g>
            <g class="advent-panel advent-panel-right">
              <g clip-path="url(#advent-right-leaf)">{{ leaf }}</g>
            </g>
          </g>
          {% if position >= 20 %}
            <path d="M-18 65h36v17h-36Zm3 3h30v11h-30Z"/>
            <path d="M-18 63q6-5 12 0m12 0q6-5 12 0m-36 21h36"/>
            <use href="#{{ surprise }}" transform="translate(-10 74) scale(.42)" aria-hidden="true"/>
            <use href="#advent-gift" transform="translate(10 75) scale(.34)" aria-hidden="true"/>
            <circle cx="16" cy="61" r="1.5"/>
          {% endif %}
          <path class="advent-hinge-line" d="M0 8v23M0 48V{% if position >= 20 %}60{% else %}54{% endif %}" aria-hidden="true"/>
          <text class="advent-window-number" x="0" y="45" aria-hidden="true">{{ day }}</text>
          {% if position < 20 %}<use href="#advent-sill" y="58" aria-hidden="true"/>{% endif %}
        {% endcapture %}
        {% if linked_post %}
          <a class="advent-door" href="{{ linked_post.url | relative_url }}" aria-label="December {{ day }}. {{ linked_post.title | escape }}">
            {{ door }}
          </a>
        {% else %}
          <g class="advent-door advent-unavailable" role="button" tabindex="0" aria-pressed="false" aria-label="December {{ day }}. Open or close window.">
            {{ door }}
          </g>
        {% endif %}
      </g>
      {% if position >= 2 and position < 20 %}
        <use href="#advent-corbels" x="{{ x }}" y="{{ y | plus: 77 }}" aria-hidden="true" pointer-events="none"/>
        <use href="#advent-balcony" x="{{ x }}" y="{{ y | plus: 59 }}" aria-hidden="true" pointer-events="none"/>
        {% if wreath_position == 1 %}
          <use href="#advent-flowerbox" x="{{ x }}" y="{{ y | plus: 64 }}" aria-hidden="true" pointer-events="none"/>
        {% else %}
          <use href="#advent-wreath" x="{{ x }}" y="{{ y | plus: 71 }}" aria-hidden="true" pointer-events="none"/>
