<div class="post-reaction">
  <span class="pie-caption" hidden>(she's cookin →)</span>
  {%- comment -%}
    The live site talks to its own /api. Local previews (jekyll serve runs in
    development) read the live counts from site.live_api but never send votes.
  {%- endcomment -%}
  {%- if jekyll.environment == "production" %}
  <button type="button" class="apple-reaction" data-post="{{ page.url | escape }}" data-api="/api/apples" aria-label="Reaction: green apple. Change to red apple">🍏</button>
  {%- else %}
  <button type="button" class="apple-reaction" data-post="{{ page.url | escape }}" data-api="{{ site.live_api | append: '/apples' }}" data-read-only aria-label="Reaction: green apple. Change to red apple">🍏</button>
  {%- endif %}
</div>
<script src="{{ '/assets/js/apple-reaction.js' | relative_url }}" defer></script>
