  {%- if site.show_drafts %}
  <script>try{var t=localStorage.getItem('theme'),d=document.documentElement;if(t==='birthday'||t==='lombard'||t==='sakura'||t==='custom'){d.dataset.theme=t;if(t==='custom'){var c=JSON.parse(localStorage.getItem('theme-custom')||'{}'),k;for(k in c)if(/^(--[a-z-]+|color-scheme)$/.test(k)&&/^(#[0-9a-f]{6}|light|dark)$/i.test(c[k]))d.style.setProperty(k,c[k])}}}catch(e){}</script>
  {%- else %}
  <script>try{var t=localStorage.getItem('theme');if(t==='birthday'||t==='lombard'||t==='sakura')document.documentElement.dataset.theme=t}catch(e){}</script>
  {%- endif %}
